version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  build:
    steps:
      - name: Install dependencies
        run: npm ci
        working-directory: ./packages/infrastructure/automation

      - name: Build
        run: npm run build
        working-directory: ./packages/infrastructure/automation
      
      - name: Deploy Automation Infrastructure
        run: npm run deploy:infra